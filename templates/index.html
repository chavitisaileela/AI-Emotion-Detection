<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Emotion Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0b1f;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .camera-section {
            background: #19132d;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: #050509;
            border-radius: 15px;
            overflow: hidden;
        }

        #camera {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        button {
            border: none;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #startBtn {
            background: #7c3aed;
            color: white;
        }

        #stopBtn {
            background: #444;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #aaa;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: #19132d;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .card-title {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
        }

        .emotions {
            background: #19132d;
            padding: 25px;
            border-radius: 15px;
        }

        .emotion-row {
            margin-bottom: 16px;
        }

        .emotion-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .bar {
            width: 100%;
            height: 10px;
            background: #302847;
            border-radius: 10px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: #8b5cf6;
            transition: width 0.3s ease;
        }

        .error {
            color: #ff6b6b;
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
            padding-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Emotion Detection</h1>
    <div class="subtitle">
        Real-time facial emotion analysis using AI
    </div>

    <div class="camera-section">

        <div class="camera-box">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
        </div>

        <div class="buttons">
            <button id="startBtn">Start Camera</button>
            <button id="stopBtn" disabled>Stop Camera</button>
        </div>

        <div class="status" id="status">
            Camera is stopped.
        </div>

    </div>

    <div class="dashboard">

        <div class="card">
            <div class="card-title">Detected Emotion</div>
            <div class="card-value" id="emotion">—</div>
        </div>

        <div class="card">
            <div class="card-title">Confidence</div>
            <div class="card-value" id="confidence">0%</div>
        </div>

        <div class="card">
            <div class="card-title">Faces Detected</div>
            <div class="card-value" id="faceCount">0</div>
        </div>

    </div>

    <div class="emotions">

        <h2>Emotion Analysis</h2>

        <div class="emotion-row">
            <div class="emotion-header">
                <span>Happy</span>
                <span id="happyValue">0%</span>
            </div>
            <div class="bar"><div class="fill" id="happyBar"></div></div>
        </div>

        <div class="emotion-row">
            <div class="emotion-header">
                <span>Sad</span>
                <span id="sadValue">0%</span>
            </div>
            <div class="bar"><div class="fill" id="sadBar"></div></div>
        </div>

        <div class="emotion-row">
            <div class="emotion-header">
                <span>Angry</span>
                <span id="angryValue">0%</span>
            </div>
            <div class="bar"><div class="fill" id="angryBar"></div></div>
        </div>

        <div class="emotion-row">
            <div class="emotion-header">
                <span>Fear</span>
                <span id="fearValue">0%</span>
            </div>
            <div class="bar"><div class="fill" id="fearBar"></div></div>
        </div>

        <div class="emotion-row">
            <div class="emotion-header">
                <span>Surprise</span>
                <span id="surpriseValue">0%</span>
            </div>
            <div class="bar"><div class="fill" id="surpriseBar"></div></div>
        </div>

        <div class="emotion-row">
            <div class="emotion-header">
                <span>Disgust</span>
                <span id="disgustValue">0%</span>
            </div>
            <div class="bar"><div class="fill" id="disgustBar"></div></div>
        </div>

        <div class="emotion-row">
            <div class="emotion-header">
                <span>Neutral</span>
                <span id="neutralValue">0%</span>
            </div>
            <div class="bar"><div class="fill" id="neutralBar"></div></div>
        </div>

    </div>

    <footer>
        Powered by LeelaX | AI Emotion Detection Project
    </footer>

</div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("overlay");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

const statusText = document.getElementById("status");

let stream = null;
let analysisTimer = null;
let analyzing = false;

startBtn.addEventListener("click", startCamera);
stopBtn.addEventListener("click", stopCamera);

async function startCamera() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 640 },
                height: { ideal: 360 },
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        startBtn.disabled = true;
        stopBtn.disabled = false;

        statusText.textContent = "Camera started. Analyzing...";
        statusText.classList.remove("error");

        analysisTimer = setInterval(analyzeFrame, 1000);

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Camera permission was denied or camera is unavailable.";

        statusText.classList.add("error");
    }
}

function stopCamera() {

    if (analysisTimer) {
        clearInterval(analysisTimer);
        analysisTimer = null;
    }

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;
    }

    video.srcObject = null;

    startBtn.disabled = false;
    stopBtn.disabled = true;

    statusText.textContent = "Camera is stopped.";

    clearOverlay();
}

async function analyzeFrame() {

    if (!stream || analyzing || video.readyState < 2) {
        return;
    }

    analyzing = true;

    try {

        const captureCanvas = document.createElement("canvas");

        captureCanvas.width = 640;
        captureCanvas.height = 360;

        const context = captureCanvas.getContext("2d");

        context.drawImage(
            video,
            0,
            0,
            captureCanvas.width,
            captureCanvas.height
        );

        const imageData = captureCanvas.toDataURL(
            "image/jpeg",
            0.75
        );

        const response = await fetch("/analyze", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                frame: imageData
            })

        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.error || "Analysis failed");
        }

        updateDashboard(result);

    } catch (error) {

        console.error("Analysis error:", error);

        statusText.textContent =
            "Unable to connect to the AI analysis server.";

        statusText.classList.add("error");

    } finally {

        analyzing = false;
    }
}

function updateDashboard(result) {

    statusText.textContent = "AI analysis running...";
    statusText.classList.remove("error");

    document.getElementById("faceCount").textContent =
        result.face_count || 0;

    clearOverlay();

    if (!result.faces || result.faces.length === 0) {

        document.getElementById("emotion").textContent = "No face";

        document.getElementById("confidence").textContent = "0%";

        resetEmotionBars();

        return;
    }

    const face = result.faces[0];

    const emotion =
        face.emotion || "neutral";

    const confidence =
        face.confidence || 0;

    document.getElementById("emotion").textContent =
        emotion.charAt(0).toUpperCase() + emotion.slice(1);

    document.getElementById("confidence").textContent =
        confidence.toFixed(1) + "%";

    updateEmotionBars(face.emotions || {});

    drawFace(face);
}

function updateEmotionBars(emotions) {

    const names = [
        "happy",
        "sad",
        "angry",
        "fear",
        "surprise",
        "disgust",
        "neutral"
    ];

    names.forEach(name => {

        const value = Number(emotions[name] || 0);

        document.getElementById(name + "Value").textContent =
            value.toFixed(1) + "%";

        document.getElementById(name + "Bar").style.width =
            Math.min(value, 100) + "%";
    });
}

function resetEmotionBars() {

    const names = [
        "happy",
        "sad",
        "angry",
        "fear",
        "surprise",
        "disgust",
        "neutral"
    ];

    names.forEach(name => {

        document.getElementById(name + "Value").textContent =
            "0%";

        document.getElementById(name + "Bar").style.width =
            "0%";
    });
}

function drawFace(face) {

    const rect = video.getBoundingClientRect();

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 360;

    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const scaleX =
        canvas.width / 640;

    const scaleY =
        canvas.height / 360;

    const x = face.x * scaleX;
    const y = face.y * scaleY;
    const w = face.w * scaleX;
    const h = face.h * scaleY;

    ctx.strokeStyle = "#8b5cf6";
    ctx.lineWidth = 3;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );

    ctx.font = "bold 18px Arial";

    ctx.fillStyle = "#8b5cf6";

    const label =
        (face.emotion || "neutral").toUpperCase();

    ctx.fillText(
        label,
        x,
        Math.max(22, y - 8)
    );
}

function clearOverlay() {

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 360;

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

</script>

</body>
</html>
